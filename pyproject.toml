[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-testing"
version = "0.9.50"
description = "Nexus Testing Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "E501"]
"scripts/**/*.py" = ["E402", "E501"]
"tests/*.py" = ["E402", "E501"]
"tests/**/*.py" = ["E402", "E501"]
"scripts/sandbox_skill_invoke.py" = ["E702"]
