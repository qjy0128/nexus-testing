name: Validate Framework

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository structure
        run: python scripts/validate-framework.py

      - name: Check shell script syntax
        run: |
          bash -n scripts/sandbox-create.sh
          bash -n scripts/sandbox-exec.sh
          bash -n scripts/sandbox-cleanup.sh
          bash -n scripts/sandbox-skill-invoke.sh
          bash -n scripts/sandbox-mock-service.sh
          bash -n scripts/sandbox-multi-turn.sh
          bash -n scripts/sandbox-compare-output.sh
          bash -n scripts/sandbox-verify-output.sh

      - name: Check Python script syntax
        run: |
          python -m py_compile scripts/validate-framework.py
          python -m py_compile scripts/skill-structure-validator.py
          python -m py_compile scripts/skill_structure_validator_core.py
          python -m py_compile scripts/sandbox_skill_invoke.py
          python -m py_compile scripts/sandbox_multi_turn.py
          python -m py_compile scripts/sandbox_skill_invoke/__init__.py
          python -m py_compile scripts/sandbox_skill_invoke/adapter.py
          python -m py_compile scripts/sandbox_skill_invoke/assertions.py
          python -m py_compile scripts/sandbox_skill_invoke/audit.py
          python -m py_compile scripts/sandbox_skill_invoke/core.py
          python -m py_compile scripts/sandbox_skill_invoke/telemetry.py
          python -m py_compile scripts/sandbox_skill_invoke/trace.py
          python -m py_compile scripts/sandbox_skill_invoke/verifier.py
          python -m py_compile scripts/test_flow_a_strict.py
          python -m py_compile scripts/test_flow_a_live_telemetry.py
          python -m py_compile scripts/test_sandbox_exec_container.py
          python -m py_compile scripts/security-scanner.py
          python -m py_compile scripts/test_sandbox_lifecycle.py
          python -m py_compile scripts/test_flow_a_integration.py
          python -m py_compile scripts/test_helpers.py

      - name: Run Flow A strict smoke tests
        run: python scripts/test_flow_a_strict.py

      - name: Run Flow A live telemetry smoke tests
        run: python scripts/test_flow_a_live_telemetry.py

      - name: Run sandbox-exec container smoke tests
        run: python scripts/test_sandbox_exec_container.py

      - name: Run security scanner against fixtures
        run: |
          python scripts/security-scanner.py scripts/fixtures/fixture-pass-skill --format json > /dev/null
          python scripts/security-scanner.py scripts/fixtures/fixture-defect-skill --format json && exit 1 || true
          python scripts/security-scanner.py scripts/fixtures/fixture-extreme-skill --format json > /dev/null

      - name: Run sandbox lifecycle E2E tests
        run: python scripts/test_sandbox_lifecycle.py

      - name: Run Flow A integration smoke tests
        run: python scripts/test_flow_a_integration.py
